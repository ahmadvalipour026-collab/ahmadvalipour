<style>
:root{
--primary:#0f172a;--primary-light:#334155;--accent:#6366f1;--accent-hover:#4f46e5;
--saffron:#f59e0b;--success:#10b981;--warning:#f97316;--danger:#ef4444;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,sans-serif;font-size:14px;line-height:1.7;overflow-x:hidden;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px}
.offline-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;text-align:center}

header.top{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);box-shadow:0 4px 6px -1px rgba(0,0,0,.02)}
.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;flex-wrap:wrap;gap:16px}
.brand{font-weight:900;font-size:15px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent),#818cf8);color:#fff;padding:6px 16px;border-radius:12px;box-shadow:0 4px 12px rgba(99,102,241,.2)}
.brand span{width:8px;height:16px;background:#fff;border-radius:4px;display:inline-block}
.who{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}

.btn-ghost{background:rgba(0,0,0,.04);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:13px;transition:all .2s}

<script>
/* =========================================================
   1. ثابت‌ها
   ========================================================= */
const SUPABASE_URL = 'https://hpgvgoehkcpjmdbfmnse.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BuJxTaMP2rYWTe5mh-N55Q_gSHE1O8g';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const CATS = { charge:'شارژ ماهیانه', water:'قبض آب', gas:'قبض گاز', electric:'برق عمومی', repair:'بازسازی', parking:'اجاره پارکینگ', debt:'پرداخت بدهی معوق', other:'سایر', bill:'کل صورتحساب ماه' };
const OCC = ['مالک ساکن','مالک','مستأجر'];

/* =========================================================
   2. Helperها
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('fa-IR').format(Math.round(Number(n) || 0));
const fa = v => String(v ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const money = n => `<span style="font-feature-settings:'tnum';white-space:nowrap;color:${Number(n)<0?'var(--danger)':'inherit'}">${fmt(n)}</span>`;

const toNum = v => {
  if (!v) return 0;
  const str = String(v)
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[,\u066C\u066B\s]/g, '')
    .replace(/[^\d.-]/g, '');
  return Number(str) || 0;
};

function jalaliToday() {
  try {
    const p = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year:'numeric', month:'numeric', day:'numeric' }).formatToParts(new Date());
    const g = t => Number(p.find(x => x.type === t)?.value);
    return { y: g('year'), m: g('month'), d: g('day') };
  } catch {
    const d = new Date();
    return { y: d.getFullYear() - 621, m: d.getMonth() + 1, d: d.getDate() };
  }
}
const TODAY = jalaliToday();

function debounce(fn, ms = 300) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function toast(msg, err = false) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast', 3200);
}
const showErr = e => toast(e?.message === 'NETWORK_ERROR' ? 'اتصال به سرور برقرار نیست' : (e?.message || 'خطا'), true);

function attachNumericInputIn(root, ...selectors) {
  selectors.forEach(sel => {
    $$(sel, root).forEach(el => {
      el.addEventListener('input', e => {
        const n = toNum(e.target.value);
        e.target.value = n ? fmt(n) : '';
      });
    });
  });
}
const attachNumericInput = (...sels) => attachNumericInputIn(document, ...sels);

/* =========================================================
   2.5 اتصال به پیام‌رسان بله (Bale)
   ========================================================= */
async function notifyBale(msg, imageBase64 = null) {
  try {
    const payload = { text: msg };
    if (imageBase64) payload.image = imageBase64;
    
    await sb.functions.invoke('send-bale', { body: payload });
    console.log('✅ Bale: پیام با موفقیت ارسال شد');
  } catch(e) {
    console.warn('❌ Bale: ارسال پیام ناموفق بود:', e);
  }
}

/* =========================================================
   3. State
   ========================================================= */
const S = {
  token: sessionStorage.getItem('bm_token'), // 👈 استفاده از sessionStorage
  me: JSON.parse(sessionStorage.getItem('bm_me') || 'null'),
  view: 'dash', y: TODAY.y, m: TODAY.m,
  building: 'مجتمع نگین ۲',
  txFilter: null,
  renderId: 0,
};

// پاک کردن توکن‌های قدیمی از حافظه مرورگر
localStorage.removeItem('bm_token');

/* =========================================================
   4. API
   ========================================================= */
function isNetworkError(msg) {
  return !!msg && /failed to fetch|network|fetch|timeout|ECONN|ERR_NETWORK|ERR_INTERNET/i.test(String(msg));
}
async function api(fn, args = {}) {
  try {
    const { data, error } = await sb.rpc(fn, args);
    if (error) {
      const rawMsg = error.message || '';
      if (rawMsg.includes('AUTH_REQUIRED')) { logout(true); throw new Error('AUTH_ERROR'); }
      if (isNetworkError(rawMsg)) throw new Error('NETWORK_ERROR');
      throw new Error(rawMsg.replace(/^AUTH_REQUIRED:\s*/, '') || 'خطا در ارتباط با سرور');
    }
    return data;
  } catch (e) {
    if (isNetworkError(e.message)) throw new Error('NETWORK_ERROR');
    throw e;
  }
}
const T = (fn, args = {}) => api(fn, { p_token: S.token, ...args });

/* =========================================================
   5. Option builders
   ========================================================= */
const monthOptions = (sel, withAll = false) =>
  (withAll ? `<option value="">همه ماه‌ها</option>` : '') +
  MONTHS.map((n, i) => `<option value="${i+1}" ${+sel === i+1 ? 'selected' : ''}>${n}</option>`).join('');
const yearOptions = (sel) => {
  const ys = []; for (let y = TODAY.y + 1; y >= 1403; y--) ys.push(y);
  return ys.map(y => `<option value="${y}" ${+y === +sel ? 'selected' : ''}>${fa(y)}</option>`).join('');
};
const unitOptions = (sel, withBuilding = true, withAll = false) =>
  (withAll ? `<option value="">همه</option>` : '') +
  (withBuilding ? `<option value="0" ${+sel === 0 ? 'selected' : ''}>ساختمان</option>` : '') +
  Array.from({length:10}, (_,i) => `<option value="${i+1}" ${+sel === i+1 ? 'selected' : ''}>واحد ${fa(i+1)}</option>`).join('');

/* =========================================================
   6. bindPeriod
   ========================================================= */
let periodAbort = null;
function bindPeriod(cb) {
  periodAbort?.abort();
  periodAbort = new AbortController();
  const opt = { signal: periodAbort.signal };
  $('#pk-m')?.addEventListener('change', e => { S.m = +e.target.value; cb(); }, opt);
  $('#pk-y')?.addEventListener('change', e => { S.y = +e.target.value; cb(); }, opt);
}
function periodPicker() {
  return `<div style="display:flex;gap:10px;margin-bottom:20px">
    <select id="pk-m" style="width:120px">${monthOptions(S.m)}</select>
    <select id="pk-y" style="width:100px">${yearOptions(S.y)}</select>
  </div>`;
}

/* =========================================================
   7. Modal
   ========================================================= */
function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><button class="x" aria-label="بستن">×</button>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.classList.contains('x')) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

/* =========================================================
   8. SMS
   ========================================================= */
function smsLink(phone, text) {
  if (!phone) return '';
  const safe = String(phone).replace(/[^\d+\-]/g, '').trim();
  if (!safe) return '';
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
  return `sms:${safe}${sep}body=${encodeURIComponent(text)}`;
}
function smsBtn(phone, text, label = 'پیامک') {
  if (!phone) return `<span class="muted" title="شماره ثبت نشده">—</span>`;
  return `<a class="btn lt sm" href="${smsLink(phone, text)}" style="padding:4px 8px;font-size:12px;">✉ ${esc(label)}</a>`;
}

/* =========================================================
   9. Image compress
   ========================================================= */
async function compressImage(file) {
  return new Promise(resolve => {
    if (!(file instanceof File) || !file.type.startsWith('image/')) {
      resolve(null);
      return;
    }

    const reader = new FileReader();

    reader.onload = ev => {
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 1000;

        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;

        if (!w || !h) {
          resolve(null);
          return;
        }

        const scale = Math.min(1, MAX / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));

        canvas.width = w;
        canvas.height = h;

        const ctx = canvas.getContext('2d');
        if (!ctx) {
          resolve(null);
          return;
        }

        ctx.drawImage(img, 0, 0, w, h);

        // JPEG فشرده برای کاهش حجم ذخیره‌سازی/انتقال
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };

      img.onerror = () => resolve(null);
      img.src = ev.target.result;
    };

    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   10. Login
   ========================================================= */
async function renderLogin() {
  $('#app').innerHTML = `
  <div class="login">
    <div class="art"><h1 id="login-title">${esc(S.building)}</h1></div>
    <div class="form">
      <div class="card">
        <h2>ورود به سامانه</h2>
        <p class="sub">لطفاً اطلاعات خود را وارد کنید.</p>
        <form id="lg" class="grid" style="gap:16px">
          <label class="f">نام کاربری<input id="lg-user" autocomplete="username" dir="ltr" required></label>
          <label class="f">رمز عبور<input id="lg-pass" type="password" autocomplete="current-password" dir="ltr" required></label>
          <button class="btn sf" type="submit" id="lg-btn">ورود به پنل</button>
          <p id="lg-err" style="color:var(--danger);margin:0;min-height:24px"></p>
          <a href="#" id="forgot-pass" style="text-align:center;font-size:13px;color:var(--muted);display:block;">رمز عبور را فراموش کرده‌اید؟</a>
        </form>
      </div>
    </div>
  </div>`;

  try {
    const info = await api('app_public_info');
    if (info?.building_name) {
      S.building = info.building_name;
      const el = $('#login-title'); if (el) el.textContent = S.building;
    }
  } catch (e) {
    if (e.message === 'NETWORK_ERROR') {
      const err = $('#lg-err');
      if (err) err.textContent = 'اتصال به سرور برقرار نیست. اتصال اینترنت را بررسی کنید.';
    }
  }

  $('#lg').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#lg-btn'); const old = btn.textContent;
    btn.disabled = true; btn.textContent = 'در حال بررسی...';
    $('#lg-err').textContent = '';
    try {
      const r = await api('app_login', { p_login: $('#lg-user').value.trim(), p_password: $('#lg-pass').value });
      if (!r.ok) { $('#lg-err').textContent = r.error; return; }
      S.token = r.token; 
      S.me = r.account;
      sessionStorage.setItem('bm_token', S.token);     // 👈 تغییر کرد
      sessionStorage.setItem('bm_me', JSON.stringify(S.me)); // 👈 تغییر کرد
      renderShell();
    } catch (err) { showErr(err); }
    finally { btn.disabled = false; btn.textContent = old; }
  });

  $('#forgot-pass').addEventListener('click', e => {
    e.preventDefault();
    const m = modal(`
      <h2>فراموشی رمز عبور</h2>
      <form id="fp-form" class="grid g2">
        <label class="f">نام کاربری<input id="fp-user" dir="ltr" required></label>
        <label class="f">شماره موبایل<input id="fp-phone" dir="ltr" required></label>
        <label class="f" style="grid-column:1/-1">رمز عبور جدید<input id="fp-pass" type="password" dir="ltr" required></label>
        <button class="btn sf" style="grid-column:1/-1">تغییر رمز عبور</button>
      </form>`);
    $('#fp-form', m).addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const r = await api('app_reset_password', {
          p_username: $('#fp-user', m).value,
          p_phone: $('#fp-phone', m).value,
          p_new_password: $('#fp-pass', m).value,
        });
        if (!r.ok) { toast(r.error, true); return; }
        m.remove(); toast('رمز عبور تغییر کرد. وارد شوید.');
      } catch (err) { showErr(err); }
    });
  });
}

async function logout(silent = false) {
  const token = S.token;

  // ابتدا State محلی را invalidate می‌کنیم تا درخواست‌های قبلی نتوانند UI را برگردانند.
  S.renderId++;
  S.token = null;
  S.me = null;
  S.view = 'dash';

  if (token && !silent) {
    try {
      await api('app_logout', { p_token: token });
    } catch {
      // خروج محلی باید حتی در صورت قطع شبکه انجام شود.
    }
  }

  // فقط داده‌های مربوط به همین برنامه پاک شوند؛ sessionStorage سایر برنامه‌ها دست‌نخورده بماند.
  sessionStorage.removeItem('bm_token');
  sessionStorage.removeItem('bm_me');

  renderLogin();
}

function getMenuItems() {
  const a = S.me?.is_admin;
  return [
    ['dash', 'داشبورد'],
    a && ['units', 'مدیریت واحدها'],
    ['announcements', 'اعلانات'],
    ['requests', a ? 'درخواست‌ها' : 'ارتباط با مدیر'],
    ['tx', 'تراکنش‌ها'],
    a && ['pay', 'تایید پرداخت‌ها'],
    ['report', 'گزارش ماهانه'],
    a && ['rates', 'نرخ‌ها و تنظیمات'],
    a && ['activity', 'گزارش فعالیت‌ها'],
    ['profile', 'پروفایل'],
  ].filter(Boolean);
}

async function renderShell() {
  const renderId = ++S.renderId;
  $('#app').innerHTML = `<div class="loading-screen"><div class="spinner"></div><p class="sub">در حال اتصال به سرور...</p></div>`;
  try {
    const account = await T('app_me');

    // جلوگیری از race condition:
    // اگر در این فاصله render دیگری شروع شده باشد، نتیجه قدیمی نباید UI را بازنویسی کند.
    if (renderId !== S.renderId) return;

    S.me = account;
    sessionStorage.setItem('bm_me', JSON.stringify(S.me));
  } catch (e) {
    if (e.message === 'AUTH_ERROR') { logout(true); return; }
    if (e.message === 'NETWORK_ERROR') { showConnectionError(); return; }
    showErr(e); return;
  }

  const menuItems = getMenuItems();
  const current = menuItems.find(t => t[0] === S.view);

  $('#app').innerHTML = `
    <header class="top">
      <div class="top-in">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div class="brand"><span></span>${esc(S.building)}</div>
          <div class="menu-dropdown">
            <button class="menu-btn" id="main-menu-btn">☰ منو ${current ? `(${esc(current[1])})` : ''} ▼</button>
            <div class="menu-content" id="main-menu">
              ${menuItems.map(([k, l]) => `<button data-v="${k}">${esc(l)}</button>`).join('')}
            </div>
          </div>
        </div>
        <div class="who">
          <span>واحد ${fa(S.me.unit_no || '—')} · <b>${esc(S.me.full_name || S.me.username)}</b>${S.me.is_admin ? ' (مدیر)' : ''}</span>
          <button class="btn-ghost" id="lo">خروج</button>
        </div>
      </div>
    </header>
    <main id="view"></main>`;

  $('#lo').addEventListener('click', () => logout());
  $('#main-menu-btn').addEventListener('click', e => { e.stopPropagation(); $('#main-menu').classList.toggle('show'); });
  $$('#main-menu button').forEach(b => b.addEventListener('click', () => {
    $('#main-menu')?.classList.remove('show');
    go(b.dataset.v);
  }));
  go(S.view);
}

function go(v, isBackNavigation = false) {
  const views = {
    dash: viewDash,
    announcements: viewAnnouncements,
    requests: viewRequests,
    tx: viewTx,
    pay: viewPay,
    report: viewReport,
    units: viewUnits,
    rates: viewRates,
    activity: viewActivity,
    profile: viewProfile,
  };

  // مسیر نامعتبر را هرگز وارد State نکن
  if (!views[v]) v = 'dash';

  S.view = v;

  const el = $('#view');
  if (!el) return;

  el.innerHTML = `<p class="sub">در حال بارگذاری...</p>`;
  renderShellHeaderState();

  const currentRenderId = ++S.renderId;

  Promise.resolve(views[v](el))
    .catch(e => {
      // نتیجه/خطای یک view قدیمی نباید view فعلی را خراب کند.
      if (currentRenderId !== S.renderId) return;

      if (e.message === 'AUTH_ERROR') {
        logout(true);
        return;
      }

      if (e.message === 'NETWORK_ERROR') {
        el.innerHTML = `<div class="card" style="text-align:center;padding:60px 20px">
          <div style="font-size:48px;margin-bottom:16px">📡</div>
          <h2>اتصال به سرور برقرار نیست</h2>
          <p class="sub">لطفاً اینترنت خود را بررسی کنید</p>
          <button class="btn sf" data-retry>تلاش مجدد</button>
        </div>`;
        $('[data-retry]', el)?.addEventListener('click', () => go(v));
        return;
      }

      showErr(e);
      el.innerHTML = `<div class="card" style="color:var(--danger)">خطا: ${esc(e.message)}</div>`;
    });

  /*
   * History policy:
   * - داشبورد صفحه ریشه منطقی برنامه است.
   * - برای viewهای داخلی یک history entry ساخته می‌شود.
   * - popstate فقط مسئول برگشت به داشبورد/خروج است.
   */
  if (!isBackNavigation && S.me) {
    const currentState = history.state;

    if (v !== 'dash' && currentState?.view !== v) {
      history.pushState(
        { app: true, view: v },
        '',
        `#${encodeURIComponent(v)}`
      );
    }
  }
}
function renderShellHeaderState() {
  const menuItems = getMenuItems();
  const current = menuItems.find(t => t[0] === S.view);
  const btn = $('#main-menu-btn');
  if (btn) btn.innerHTML = `☰ منو ${current ? `(${esc(current[1])})` : ''} ▼`;
  $$('#main-menu button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
}

function showConnectionError() {
  $('#app').innerHTML = `
    <div class="offline-screen">
      <div class="offline-icon">📡</div>
      <h1>اتصال به سرور برقرار نیست</h1>
      <p class="sub" style="max-width:420px">لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید. اطلاعات حساب شما حفظ شده است.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn sf" id="retry" style="min-width:180px">تلاش مجدد</button>
        <button class="btn lt" id="lo2" style="min-width:180px">خروج از حساب</button>
      </div>
    </div>`;
  $('#retry').addEventListener('click', renderShell);
  $('#lo2').addEventListener('click', () => logout());
}

const mustChangeBanner = () => S.me?.must_change_password
  ? `<div class="card" style="background:#fef3c7;color:#92400e;margin-bottom:20px">رمز عبور شما هنوز پیش‌فرض است. از بخش <a href="#" id="go-profile">پروفایل</a> آن را تغییر دهید.</div>`
  : '';

function billCard(r, rep) {

  const w = Number(r.water) || 0;
  const rep_amt = Number(r.repair) || 0;
  const park = Number(r.parking) || 0;
  const prev = Number(r.prev_debt) || 0;
  const paid = Number(r.paid_this_month) || 0;
  const rem = Number(r.remaining) || 0;

  return `
  <div class="card" style="padding:0;overflow:hidden">
    <div style="background:var(--primary);color:#fff;padding:24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px">
      <div>
        <div style="color:#94a3b8;font-size:13px">
          صورتحساب ${fa(rep.year)} · ${esc(r.full_name || '')} 
         <span class="chip ex" style="color:#ef4444;border:1px solid #ef4444">${esc(r.occupancy)}</span>
        </div>
      </div>
      <div style="text-align:left">
        <small style="color:#94a3b8">مانده قابل پرداخت (تومان)</small>
        <div style="font-size:36px;font-weight:900;line-height:1.2">${fmt(rem)}</div>
      </div>
    </div>
    
    <div style="padding:10px 24px">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)">
        <span>سهم قبض آب: <b>${money(w)}</b> تومان</span>
        <span>${(w === 0 || r.ok_water) ? '<span class="chip ok">پرداخت شده</span>' : '<span class="chip no">پرداخت نشده</span>'}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)">
        <span>بازسازی: <b>${money(rep_amt)}</b> تومان</span>
        <span>${(rep_amt === 0 || r.ok_repair) ? '<span class="chip ok">پرداخت شده</span>' : '<span class="chip no">پرداخت نشده</span>'}</span>
      </div>
      ${park > 0 ? `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)">
        <span>اجاره پارکینگ: <b>${money(park)}</b> تومان</span>
        <span>${r.ok_parking ? '<span class="chip ok">پرداخت شده</span>' : '<span class="chip no">پرداخت نشده</span>'}</span>
      </div>` : ''}
    </div>
    
    <div style="background:#f8fafc;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;border-top:1px solid var(--line)">
      <div>
        <small style="color:var(--muted);display:block">بدهی قبلی</small>
        <b>${money(prev)}</b> تومان
      </div>
      <div>
        <small style="color:var(--muted);display:block">پرداختی این ماه</small>
        <b>${money(paid)}</b> تومان
      </div>
    </div>
  </div>`;
}
function reminderText(r, rep) {
  return `${S.building} - واحد ${r.unit_no}\nصورتحساب ${rep.month_name} ${rep.year}:\n` +
    `شارژ ${fmt(r.charge)} | آب ${fmt(r.water)} | گاز ${fmt(r.gas)} | بازسازی ${fmt(r.repair)}` +
    (r.parking ? ` | پارکینگ ${fmt(r.parking)}` : '') +
    `\nبدهی قبلی: ${fmt(r.prev_debt)}\nمانده قابل پرداخت: ${fmt(r.remaining)} تومان`;
}

function reqTable(list, admin) {
  if (!list || !list.length) return `<p class="sub">موردی نیست</p>`;
  const st = s => s === 'approved' ? '<span class="chip ok">تایید شد</span>'
    : s === 'rejected' ? '<span class="chip no">رد شد</span>'
    : '<span class="chip pd">منتظر تایید</span>';
  return `<div class="tbl-wrap" style="border:0"><table><thead><tr>
    ${admin ? '<th>واحد</th>' : ''}<th>ماه</th><th>مبلغ</th><th>وضعیت</th>${admin ? '<th></th>' : ''}
  </tr></thead><tbody>
    ${list.map(p => `<tr>
      ${admin ? `<td><b>واحد ${fa(p.unit_no)}</b><br><span style="font-size:12px;color:var(--muted)">${esc(p.full_name || '')}</span></td>` : ''}
      <td>${MONTHS[p.month - 1]} ${fa(p.year)}</td>
      <td>${money(p.amount)}</td>
      <td>${st(p.status)}</td>
      <td>${admin && p.status === 'pending' ? `<button class="btn sm" data-ap="${p.id}">بررسی</button>` : ''}</td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

async function viewDash(el) {
  const rep = await T('app_report', { p_year: S.y, p_month: S.m });
  const missing = rep.missing_rates?.length
    ? `<div class="card" style="background:#fee2e2;color:#991b1b;margin-bottom:20px">مبالغ شارژ/بازسازی برای این ماه‌ها تعریف نشده: ${rep.missing_rates.map(fa).join('، ')}</div>`
    : '';

  if (!S.me.is_admin) {
    const r = rep.rows[0];
    const reqs = await T('app_get_payment_requests');
    el.innerHTML = `${mustChangeBanner()}
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px">
        <div><h1>سلام واحد ${fa(S.me.unit_no)}</h1><p class="sub" style="margin:0">صورتحساب ${rep.month_name} ${fa(rep.year)}</p></div>
        ${periodPicker()}
      </div>
      ${missing}
      ${r ? billCard(r, rep) : '<p class="sub">صورتحسابی ثبت نشده.</p>'}
      <h2 style="margin-top:32px">سابقه پرداخت‌ها</h2>
      ${reqTable(reqs.slice(0, 8), false)}`;
    bindPeriod(() => go('dash'));
    $('#go-profile')?.addEventListener('click', e => { e.preventDefault(); go('profile'); });
    return;
  }

  const fund = await T('app_fund_summary', { p_year: S.y, p_month: S.m });
  const rows = rep.rows || [];

  const unitMap = {};
  rows.forEach(r => {
    if (!unitMap[r.unit_no]) unitMap[r.unit_no] = { unit_no: r.unit_no, remaining: 0, current_due: 0, accounts: [], display_name: '' };
    unitMap[r.unit_no].remaining += r.remaining;
    unitMap[r.unit_no].current_due += r.current_due;
    unitMap[r.unit_no].accounts.push(r);
    if (!unitMap[r.unit_no].display_name && r.full_name) unitMap[r.unit_no].display_name = r.full_name;
  });

  const mapUnits = [];
  for (let i = 1; i <= 10; i++) {
    mapUnits.push(unitMap[i] || { unit_no: i, remaining: 0, current_due: 0, accounts: [], display_name: '-' });
  }

  const floors = [];
  for (let u = 9; u >= 1; u -= 2) {
    floors.push([mapUnits.find(x => x.unit_no === u), mapUnits.find(x => x.unit_no === u + 1)]);
  }

  const totalDebt = mapUnits.reduce((s, r) => s + Math.max(0, r.remaining), 0);
  const winBg = r => r.remaining <= 0 ? '#d1fae5' : r.remaining > r.current_due ? '#fee2e2' : '#fef3c7';

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:24px">
      <div><h1>داشبورد مدیریت</h1><p class="sub" style="margin:0">خلاصه وضعیت صندوق در ${rep.month_name} ${fa(rep.year)}</p></div>
      ${periodPicker()}
    </div>
    ${missing}
    ${mustChangeBanner()}
    <div class="grid g3" style="margin-bottom:24px">
      <div class="card" style="background:var(--accent);color:#fff">
        <small style="opacity:.8">موجودی فعلی صندوق</small>
        <div style="font-size:32px;font-weight:900">${fmt(fund.balance)}</div>
      </div>
      <div class="card"><small style="color:var(--muted)">درآمد این ماه</small><div style="font-size:24px;font-weight:900;color:var(--success)">${money(fund.month_income ?? fund.month_expense)}</div></div>
      <div class="card"><small style="color:var(--muted)">مطالبات معوق</small><div style="font-size:24px;font-weight:900;color:var(--warning)">${money(totalDebt)}</div></div>
    </div>

    <div class="grid g2">
      <div class="card">
        <h2>نقشه ساختمان</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">
          ${floors.map(fl => fl.map(r => r ? `
            <button class="win" data-u="${r.unit_no}" style="background:${winBg(r)}">
              <span style="font-size:14px;font-weight:700;color:var(--muted)">واحد ${fa(r.unit_no)}</span>
              <span style="font-size:16px;font-weight:900">${esc(r.display_name)}</span>
              <span style="font-size:14px;font-weight:700;margin-top:8px">${r.remaining <= 0 ? 'تسویه' : fmt(r.remaining) + ' تومان'}</span>
            </button>` : '').join('')).join('')}
        </div>
      </div>
      <div class="grid" style="align-content:start">
        <div class="card">
          <div style="display:flex;justify-content:space-between;margin-bottom:10px">
            <h2 style="margin:0">پرداخت‌های منتظر تایید</h2>
            <button class="btn lt sm" id="go-pay">مشاهده</button>
          </div>
          <div style="font-size:36px;font-weight:900;color:var(--warning)">${fa(fund.pending_payments)}</div>
        </div>
        <div class="card">
          <h2>قبض‌های این ماه</h2>
          <div style="font-size:13px;color:var(--muted);line-height:2">
            قبض آب: ${fmt(rep.water_total)} تومان<br>
            قبض گاز: ${fmt(rep.gas_total)} تومان
          </div>
        </div>
      </div>
    </div>`;

  bindPeriod(() => go('dash'));
  $('#go-pay')?.addEventListener('click', () => go('pay'));
  $('#go-profile')?.addEventListener('click', e => { e.preventDefault(); go('profile'); });

  $$('.win', el).forEach(b => b.addEventListener('click', () => {
    const uData = mapUnits.find(x => x.unit_no == b.dataset.u);
    if (!uData) return;
    const cardsHtml = uData.accounts.length
      ? uData.accounts.map(r => billCard(r, rep)).join('<hr style="border:0;border-top:1px dashed var(--line);margin:20px 0">')
      : '<p class="sub" style="text-align:center;padding:20px">حسابی برای این واحد ثبت نشده است.</p>';
    const smsHtml = uData.accounts.map(r => r.phone ? smsBtn(r.phone, reminderText(r, rep), `پیامک به ${r.full_name || r.occupancy}`) : '').join('');
    const m = modal(`
      <div style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h2 style="margin:0">صورتحساب واحد ${fa(uData.unit_no)}</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${smsHtml}</div>
      </div>
      ${cardsHtml}
      <div style="margin-top:20px"><button class="btn lt sm" id="m-tx">تراکنش‌های این واحد</button></div>`);
    $('#m-tx', m)?.addEventListener('click', () => {
      m.remove();
      S.txFilter = { y: S.y, m: '', unit: String(uData.unit_no), type: '' };
      go('tx');
    });
  }));
}

async function viewRequests(el) {
  const list = await T('app_get_requests');

function exportCsv(rows) {
  const sep = ';';
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const head = ['تاریخ', 'سال', 'ماه', 'واحد', 'نوع', 'محل', 'شرح', 'مبلغ', 'نوع سکونت'];
  const lines = [head.map(q).join(sep)].concat(rows.slice().reverse().map(t => [
    t.tx_date, t.year, t.month_name, t.unit_no ? 'واحد ' + t.unit_no : 'ساختمان',
    t.tx_type, t.location, t.description, t.amount, t.occupancy,
  ].map(q).join(sep)));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Transactions.csv';
  a.click();
}

            <td style="border: 1px solid #333; padding: 6px; font-weight: bold; font-size: 14px;">${fmt(r.remaining)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
  bindPeriod(() => go('report'));
  
  $('#pr-btn')?.addEventListener('click', () => window.print());
  
  $('#bale-btn')?.addEventListener('click', async () => {
    const btn = $('#bale-btn');
    const oldText = btn.textContent;
    btn.textContent = 'در حال ساخت عکس...';
    btn.disabled = true;

    try {
      const tableElement = $('.tbl-wrap');
      
      const originalOverflow = tableElement.style.overflow;
      const originalMaxHeight = tableElement.style.maxHeight;
      const originalWidth = tableElement.style.width;

      // عرض رو کمتر میکنیم تا فشرده نشه و فونت‌ها درشت بمونن
      tableElement.style.overflow = 'visible';
      tableElement.style.maxHeight = 'none';
      tableElement.style.width = '1000px'; 

      const canvas = await html2canvas(tableElement, { 
        scale: 2, // کیفیت ۲ برابر کافیه
        backgroundColor: '#ffffff',
        windowWidth: 1000, // عرض ثابت ۱۰۰۰ پیکسل
        width: 1000,
        ignoreElements: (element) => element.classList.contains('no-bale')
      });
      
      tableElement.style.overflow = originalOverflow;
      tableElement.style.maxHeight = originalMaxHeight;
      tableElement.style.width = originalWidth;

      // کیفیت فشرده سازی رو 0.9 میذاریم تا هم حجمش کم باشه هم خوانا
      const base64Image = canvas.toDataURL('image/jpeg', 0.9);

      btn.textContent = 'در حال ارسال به بله...';
      
      await notifyBale(`📊 گزارش ماهانه ${rep.month_name} ${fa(rep.year)}\n${S.building}`, base64Image);
      
      toast('گزارش با موفقیت به گروه بله ارسال شد');
    } catch (e) {
      showErr(e);
    } finally {
      btn.textContent = oldText;
      btn.disabled = false;
    }
  });
}

async function archiveAccount(acc) {
  const newUsername = `deleted_${Date.now()}_${acc.username}`.slice(0, 60);
  await T('app_admin_save_account', {
    p_id: acc.id,
    p_unit_no: acc.unit_no,
    p_username: newUsername,
    p_full_name: acc.full_name,
    p_phone: acc.phone,
    p_occupancy: acc.occupancy,
    p_is_primary: false,
    p_is_active: false,
    p_new_password: null,
    p_start_ym: acc.start_ym || 140406,
  });
}

          </p>

            <div style="background:#f1f5f9;padding:12px;border-radius:8px;margin-bottom:8px;font-size:13px">
              <b>${esc(a.full_name || '—')}</b> · ${esc(a.occupancy)} · ${esc(a.phone || '—')}
              <span class="chip ex" style="margin-right:8px">آرشیو</span>

          p_username: f.elements.username.value,
          p_full_name: f.elements.full_name.value,
          p_phone: f.elements.phone.value,
          p_occupancy: f.elements.occupancy.value,
          p_is_primary: true,
          p_is_active: true,
          p_new_password: f.elements.pass.value || null,

      if (!confirm('رمز عبور این کاربر بازنشانی شود؟')) return;
      try {
        const newPass = await T('app_admin_reset_password', { p_id: f.dataset.id });
        alert('رمز جدید: ' + newPass + '\n\nلطفاً به ساکن اطلاع دهید.');
        toast('رمز بازنشانی شد');

        `✓ نام کاربری برای نفر جدید آزاد می‌شود\n\n` +
        `⚠️ توجه: بعد از آرشیو، بازگردانی ممکن نیست.\n` +
        `   اگر این نفر برگشت، باید حساب جدید بسازید.\n\n` +

        await T('app_admin_save_account', {
          p_id: null,
          p_unit_no: u.unit_no,
          p_username: e.target.username.value,
          p_full_name: e.target.name.value,
          p_phone: e.target.phone.value,
          p_occupancy: e.target.occupancy.value,
          p_is_primary: true,
          p_is_active: true,
          p_new_password: e.target.pass.value,
          p_start_ym: 140406,
        });
        m.remove();
        toast('تغییرات اعمال شد');
        go('units');
      } catch (err) { showErr(err); }
    });
  }
  
  else if (scenario === 'vacant') {
    container.innerHTML = `
      <div class="card" style="background:#fee2e2;margin-bottom:16px;font-size:13px">
        <b>⚠️ همه‌ی حساب‌های این واحد آرشیو می‌شوند (دائمی).</b>
        <p style="margin:8px 0 0">تراکنش‌های قبلی حفظ می‌شوند.</p>
      </div>
      <button class="btn rd" id="apply-vacant">🗑️ تایید خالی شدن</button>
    `;
    
    $('#apply-vacant', container)?.addEventListener('click', async () => {
      if (!confirm('مطمئنید؟ همه حساب‌های این واحد آرشیو می‌شوند (دائمی).')) return;
      try {
        for (const acc of activeAccounts) await archiveAccount(acc);
        m.remove();
        toast('واحد خالی شد');
        go('units');
      } catch (err) { showErr(err); }
    });
  }
}

                </div>

          </div>
          <label class="f" style="grid-column:1/-1">پرداخت‌کننده آب/گاز</label>
          <div style="grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap">

  $('#rates-accordion')?.addEventListener('click', e => {
    if (e.target.closest('.accordion-header')) e.target.closest('.accordion-header')?.nextElementSibling?.classList.toggle('open');
  });

  attachNumericInput('#r-c', '#r-r', '#r-p', '#s-o');

  $$('[data-er]').forEach(b => b.addEventListener('click', () => {
    const [y, mo] = b.dataset.er.split('-').map(Number);
    const r = rates.find(x => x.year === y && x.month === mo);
    if (!r) return;
    $('#r-y').value = y;
    $('#r-m').value = mo;
    $('#r-c').value = fmt(r.charge);
    $('#r-r').value = fmt(r.repair);

    $$('.r-prp').forEach(cb => cb.checked = (r.payer_repair || OCC).includes(cb.value));
    $$('.r-ppk').forEach(cb => cb.checked = (r.payer_parking || OCC).includes(cb.value));
    $$('.r-pu').forEach(cb => cb.checked = (r.payer_water || OCC).includes(cb.value));
    $('#rf')?.scrollIntoView({ behavior: 'smooth' });
  }));

  $$('[data-dr]').forEach(b => b.addEventListener('click', async () => {

  $('#rf')?.addEventListener('submit', async e => {
    e.preventDefault();
    const getChecked = cls => $$('.' + cls).filter(x => x.checked).map(x => x.value);
    try {
      const y = +$('#r-y').value;
      const m = +$('#r-m').value;
      const charge = toNum($('#r-c').value);
      const repair = toNum($('#r-r').value);
      const parking = toNum($('#r-p').value);

      await T('app_admin_save_rate', {
        p_year: y,
        p_month: m,
        p_charge: charge,
        p_repair: repair,
        p_parking: parking,
        p_payer_charge: getChecked('r-pch'),
        p_payer_repair: getChecked('r-prp'),
        p_payer_parking: getChecked('r-ppk'),
        p_payer_water: getChecked('r-pu'),
        p_payer_gas: getChecked('r-pu'),
      });
      
      notifyBale(`📊 نرخ‌های ماه ${MONTHS[m-1]} ${y} ثبت/ویرایش شد:\n\n🔹 شارژ: ${fmt(charge)} تومان\n🔹 بازسازی: ${fmt(repair)} تومان\n🔹 پارکینگ: ${fmt(parking)} تومان`);
      
      toast('ذخیره شد و به بله ارسال گردید'); 
      go('rates');
    } catch (err) { showErr(err); }
  });

  $('#sf')?.addEventListener('submit', async e => {
    e.preventDefault();
    const s = toNum($('#s-s').value.replace('/', ''));
    try {
      await T('app_admin_save_settings', {
        p_building_name: $('#s-n').value,
        p_opening_balance: toNum($('#s-o').value),
        p_start_ym: s,
      });
      toast('ذخیره شد'); renderShell();
    } catch (err) { showErr(err); }
  });
}

/* =========================================================
   22. Back Navigation — Double Back to Exit
   ---------------------------------------------------------
   سیاست:
   1) داخل هر صفحه غیر از داشبورد:
      Back => داشبورد
   2) روی داشبورد:
      Back اول => پیام «دوباره بزنید»
      Back دوم حداکثر تا 2 ثانیه => خروج از صفحه/برنامه
   3) Back اول هرگز نباید اجازه عبور به History قبلی مرورگر را بدهد.
   ========================================================= */

const BACK_EXIT_WINDOW_MS = 2000;

let backPressCount = 0;
let backPressTimer = null;
let appHistoryReady = false;

function resetBackPress() {
  backPressCount = 0;

  if (backPressTimer) {
    clearTimeout(backPressTimer);
    backPressTimer = null;
  }
}

/*
 * History Guard
 *
 * همیشه یک Entry محافظ جلوی Entry فعلی برنامه نگه می‌داریم.
 * بنابراین Back اول فقط popstate ایجاد می‌کند و به سایت/صفحه
 * قبلی مرورگر عبور نمی‌کند.
 */
function ensureAppHistory() {
  const current = history.state;

  if (!current?.app) {
    history.replaceState(
      { app: true, view: S.view || 'dash', root: true },
      '',
      '#app'
    );

    history.pushState(
      { app: true, view: S.view || 'dash', guard: true },
      '',
      '#app'
    );
  } else if (!current.guard) {
    history.pushState(
      {
        ...current,
        app: true,
        view: S.view || current.view || 'dash',
        guard: true
      },
      '',
      '#app'
    );
  }

  appHistoryReady = true;
}

function rearmHistoryGuard() {
  history.pushState(
    {
      app: true,
      view: S.view || 'dash',
      guard: true
    },
    '',
    '#app'
  );
}

function handleBackNavigation() {
  /*
   * مهم:
   * این شرط نباید بر اساس S.me باشد.
   * اگر S.me هنوز به‌صورت async آماده نشده باشد، Back اول
   * نباید باعث خروج مستقیم مرورگر شود.
   */
  if (!appHistoryReady) {
    ensureAppHistory();
    return;
  }

  /*
   * اگر صفحه‌ای داخلی باز است، Back فقط به داشبورد می‌رود.
   * در این حالت اصلاً وارد منطق Double Back نمی‌شویم.
   */
  if (S.me && S.view !== 'dash') {
    resetBackPress();

    go('dash', true);

    /*
     * Entry فعلی را به Guard داشبورد تبدیل می‌کنیم.
     * این کار جلوی زنجیره شدن History صفحات داخلی را می‌گیرد.
     */
    history.replaceState(
      {
        app: true,
        view: 'dash',
        guard: true
      },
      '',
      '#app'
    );

    return;
  }

  /*
   * اگر هنوز کاربر لاگین را کامل نکرده، فقط Guard را دوباره فعال کن.
   * Back اول نباید باعث خروج ناخواسته از صفحه برنامه شود.
   */
  if (!S.me) {
    resetBackPress();
    rearmHistoryGuard();
    return;
  }

  /*
   * Dashboard — Back اول
   */
  if (backPressCount === 0) {
    backPressCount = 1;

    toast('برای خروج، دوباره دکمه بازگشت را بزنید', true);

    clearTimeout(backPressTimer);

    backPressTimer = setTimeout(() => {
      backPressCount = 0;
      backPressTimer = null;
    }, BACK_EXIT_WINDOW_MS);

    /*
     * بعد از popstate دوباره یک Guard می‌سازیم.
     * بنابراین Back اول هیچ‌وقت به صفحه قبلی مرورگر نمی‌رسد.
     */
    rearmHistoryGuard();

    return;
  }

  /*
   * Dashboard — Back دوم در بازه 2 ثانیه
   */
  resetBackPress();

  /*
   * اینجا عمداً logout نمی‌کنیم و sessionStorage را پاک نمی‌کنیم.
   * خروج فقط از History برنامه است.
   *
   * چون Back اول یک Guard جدید ساخته، Back دوم اکنون از
   * مرز برنامه عبور می‌کند.
   */
  history.back();
}

window.addEventListener('popstate', handleBackNavigation);

/*
 * راه‌اندازی History Guard فقط یک بار.
 * اگر hash قبلی مربوط به برنامه باشد، همان ساختار حفظ می‌شود.
 */
ensureAppHistory();

/*
 * وقتی برنامه به پس‌زمینه می‌رود، شمارنده Double Back منقضی شود.
 * این کار مانع می‌شود Back اول قبل از خروج و Back دوم بعد از
 * برگشت از یک برنامه دیگر به‌عنوان یک جفت محسوب شوند.
 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    resetBackPress();
  }
});

// بستن منوی اصلی با کلیک بیرون از آن — فقط یک listener سراسری
document.addEventListener('click', e => {
  if (!e.target.closest('.menu-dropdown')) {
    $('#main-menu')?.classList.remove('show');
  }
});

// وقتی برنامه به پس‌زمینه می‌رود، Double Back از حالت نیمه‌کاره خارج شود.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    resetBackPress();
  }
});
if (S.token) renderShell(); else renderLogin();
</script>
