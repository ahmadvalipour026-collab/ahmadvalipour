<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مجتمع نگین ۲ | مدیریت ساختمان</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M20 80 L20 30 L50 10 L80 30 L80 80 Z' fill='white'/><rect x='40' y='60' width='20' height='20' fill='%236366f1'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary: #0f172a; --primary-light: #334155; --accent: #6366f1; --accent-hover: #4f46e5;
  --saffron: #f59e0b; --success: #10b981; --warning: #f97316; --danger: #ef4444;
  --bg: #f8fafc; --card: #ffffff; --line: #e2e8f0; --ink: #1e293b; --muted: #64748b;
  --r: 16px; --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,sans-serif;font-size:14px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}

header.top{background:rgba(255, 255, 255, 0.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02)}
.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;flex-wrap:wrap;gap:16px}
.brand{font-weight:900;font-size:15px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg, var(--accent), #818cf8);color:#fff;padding:6px 16px;border-radius:12px;box-shadow:0 4px 12px rgba(99, 102, 241, 0.2)}
.brand span{width:8px;height:16px;background:#fff;border-radius:4px;display:inline-block}

.who{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.who b{color:var(--ink)}
.btn-ghost{background:rgba(0,0,0,0.04);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-ghost:hover{background:rgba(0,0,0,0.08)}

/* منوی کشویی برای مدیر */
.menu-dropdown{position:relative;display:inline-block}
.menu-btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(15,23,42,0.2)}
.menu-btn:hover{background:var(--primary-light)}
.menu-content{display:none;position:absolute;left:0;top:calc(100% + 8px);background:var(--card);min-width:180px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);border:1px solid var(--line);z-index:100;overflow:hidden}
.menu-content.show{display:block}
.menu-content button{display:block;width:100%;text-align:right;padding:12px 16px;background:none;border:0;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);font-size:13.5px}
.menu-content button:last-child{border-bottom:0}
.menu-content button:hover{background:var(--bg);color:var(--accent)}
.menu-content button.on{background:rgba(99,102,241,0.08);color:var(--accent);font-weight:700;border-right:3px solid var(--accent)}

/* تب‌های افقی برای ساکنین */
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap;transition:all .2s}
nav.tabs button:hover{color:var(--accent);background:rgba(99, 102, 241, 0.05)}
nav.tabs button.on{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(99, 102, 241, 0.3)}

main{max-width:1200px;margin:auto;padding:28px 24px 80px}
h1{font-size:26px;font-weight:900;margin:0 0 4px;letter-spacing:-.5px}
h2{font-size:18px;font-weight:700;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);transition:transform .2s}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;min-height:46px;width:100%;transition:all .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(99, 102, 241, 0.1)}

.btn{border:0;border-radius:12px;padding:10px 20px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(99, 102, 241, 0.25);transition:all .2s}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 6px 16px rgba(99, 102, 241, 0.35)}
.btn.sf{background:linear-gradient(135deg, #f59e0b, #d97706);box-shadow:0 4px 12px rgba(245, 158, 11, 0.3)}
.btn.sf:hover{background:linear-gradient(135deg, #d97706, #b45309)}
.btn.lt{background:#f1f5f9;color:var(--ink);box-shadow:none}
.btn.lt:hover{background:#e2e8f0}
.btn.rd{background:#fee2e2;color:var(--danger);box-shadow:none}
.btn.rd:hover{background:#fecaca}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 12px;font-size:12.5px;font-weight:700}
.chip.ok{background:#d1fae5;color:#065f46}
.chip.no{background:#fee2e2;color:#991b1b}
.chip.pd{background:#fef3c7;color:#92400e}
.chip.ex{background:#f1f5f9;color:#475569}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:700;color:var(--muted);text-align:right;padding:12px 8px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}
.tbl-wrap{overflow:auto;max-height:70vh;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 24px;border-radius:14px;opacity:0;transition:all .3s;z-index:99;box-shadow:0 10px 25px rgba(0,0,0,0.2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}

.login{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;background:#fff}
.login .art{background:linear-gradient(135deg, var(--primary), #1e293b);display:flex;align-items:center;justify-content:center;padding:40px;color:#fff;position:relative;overflow:hidden}
.login .art h1{font-size:36px;text-align:center;line-height:1.4;font-weight:900}
.login .form{display:flex;align-items:center;justify-content:center;padding:40px}
.login .form .card{width:100%;max-width:400px;border:0;box-shadow:none}
@media(max-width:820px){.login{grid-template-columns:1fr}.login .art{min-height:200px;padding:20px}}

.modal-bg{position:fixed;inset:0;background:rgba(15, 23, 42, 0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:720px;padding:30px;box-shadow:0 25px 50px -12px rgba(0, 0, 0, 0.25);max-height:90vh;overflow-y:auto;position:relative}
.modal .x{position:absolute;top:20px;left:20px;background:var(--bg);border:0;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal .x:hover{background:var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = 'https://hpgvgoehkcpjmdbfmnse.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BuJxTaMP2rYWTe5mh-N55Q_gSHE1O8g';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const CATS = { charge:'شارژ ماهیانه', water:'قبض آب', gas:'قبض گاز', repair:'بازسازی', parking:'اجاره پارکینگ', debt:'پرداخت بدهی معوق', other:'سایر', bill:'کل صورتحساب ماه' };
const OCC = ['مالک ساکن','مالک','مستأجر'];

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('fa-IR').format(Math.round(Number(n) || 0));
const money = n => `<span style="font-feature-settings:'tnum';white-space:nowrap;color:${Number(n)<0?'var(--danger)':'inherit'}">${fmt(n)}</span>`;
const fa = v => String(v ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const toNum = v => Number(String(v ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.-]/g, '')) || 0;

function jalaliToday() {
  const p = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(new Date());
  const g = t => Number(p.find(x => x.type === t)?.value);
  return { y: g('year'), m: g('month'), d: g('day') };
}
const TODAY = jalaliToday();

function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200);
}

const S = {
  token: localStorage.getItem('bm_token'),
  me: JSON.parse(localStorage.getItem('bm_me') || 'null'),
  view: 'dash', y: TODAY.y, m: TODAY.m, building: 'مجتمع نگین ۲',
};

async function api(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    const msg = (error.message || '').replace(/^AUTH_REQUIRED:\s*/, '');
    if ((error.message || '').startsWith('AUTH_REQUIRED')) { logout(true); }
    throw new Error(msg || 'خطا در ارتباط با سرور');
  }
  return data;
}
const T = (fn, args = {}) => api(fn, { p_token: S.token, ...args });

const monthOptions = (sel, withAll = false) =>
  (withAll ? `<option value="">همه ماه‌ها</option>` : '') +
  MONTHS.map((n, i) => `<option value="${i + 1}" ${i + 1 == sel ? 'selected' : ''}>${n}</option>`).join('');
const yearOptions = (sel) => {
  const ys = []; for (let y = TODAY.y + 1; y >= 1403; y--) ys.push(y);
  return ys.map(y => `<option value="${y}" ${y == sel ? 'selected' : ''}>${fa(y)}</option>`).join('');
};
const unitOptions = (sel, withBuilding = true, withAll = false) =>
  (withAll ? `<option value="">همه</option>` : '') +
  (withBuilding ? `<option value="0" ${sel === 0 || sel === '0' ? 'selected' : ''}>ساختمان</option>` : '') +
  Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}" ${sel == i + 1 ? 'selected' : ''}>واحد ${fa(i + 1)}</option>`).join('');

function periodPicker() {
  return `<div class="row no-print" style="display:flex;gap:10px;margin-bottom:20px">
    <select id="pk-m" style="width:120px">${monthOptions(S.m)}</select>
    <select id="pk-y" style="width:100px">${yearOptions(S.y)}</select></div>`;
}
function bindPeriod(cb) {
  $('#pk-m')?.addEventListener('change', e => { S.m = +e.target.value; cb(); });
  $('#pk-y')?.addEventListener('change', e => { S.y = +e.target.value; cb(); });
}
function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><button class="x" aria-label="بستن">×</button>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.classList.contains('x')) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

function smsLink(phone, text) {
  if (!phone) return '';
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
  return `sms:${phone}${sep}body=${encodeURIComponent(text)}`;
}
function smsBtn(phone, text, label = 'پیامک') {
  if (!phone) return `<span class="muted" title="شماره ثبت نشده">—</span>`;
  return `<a class="btn lt sm" href="${smsLink(phone, text)}" style="padding:4px 8px;font-size:12px;">✉ ${label}</a>`;
}

async function compressImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
        let width = img.width; let height = img.height;
        if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
        else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
    };
  });
}

// =====================================================================
//  ورود
// =====================================================================
async function renderLogin() {
  $('#app').innerHTML = `
    <div class="login">
      <div class="art">
        <h1 id="login-title">${esc(S.building)}</h1>
      </div>
      <div class="form">
        <div class="card">
          <h2>ورود به سامانه</h2>
          <p class="sub">لطفاً اطلاعات خود را وارد کنید.</p>
          <form id="lg" class="grid" style="gap:16px">
            <label class="f">نام کاربری<input id="lg-user" autocomplete="username" dir="ltr" required></label>
            <label class="f">رمز عبور<input id="lg-pass" type="password" autocomplete="current-password" dir="ltr" required></label>
            <button class="btn sf" type="submit">ورود به پنل</button>
            <p id="lg-err" style="color:var(--danger);margin:0;min-height:24px"></p>
            <a href="#" id="forgot-pass" style="text-align:center; font-size:13px; color:var(--muted); display:block;">رمز عبور را فراموش کرده‌اید؟</a>
          </form>
        </div>
      </div>
    </div>`;
  
  try {
    const info = await api('app_public_info');
    if (info.building_name) {
      S.building = info.building_name;
      $('#login-title').textContent = S.building;
    }
  } catch(e){}

  $('#lg').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const r = await api('app_login', { p_login: $('#lg-user').value.trim(), p_password: $('#lg-pass').value });
      if (!r.ok) { $('#lg-err').textContent = r.error; return; }
      S.token = r.token; S.me = r.account;
      localStorage.setItem('bm_token', S.token);
      localStorage.setItem('bm_me', JSON.stringify(S.me));
      renderShell();
    } catch (err) { $('#lg-err').textContent = err.message; }
  });

  $('#forgot-pass').addEventListener('click', e => {
    e.preventDefault();
    const m = modal(`<h2>فراموشی رمز عبور</h2>
      <form id="fp-form" class="grid g2">
        <label class="f">نام کاربری<input id="fp-user" dir="ltr" required></label>
        <label class="f">شماره موبایل<input id="fp-phone" dir="ltr" required></label>
        <label class="f" style="grid-column:1/-1">رمز عبور جدید<input id="fp-pass" type="password" dir="ltr" required></label>
        <button class="btn sf" style="grid-column:1/-1">تغییر رمز عبور</button>
      </form>`);
    $('#fp-form', m).addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const r = await api('app_reset_password', { p_username: $('#fp-user', m).value, p_phone: $('#fp-phone', m).value, p_new_password: $('#fp-pass', m).value });
        if (!r.ok) { toast(r.error, true); return; }
        m.remove(); toast('رمز عبور تغییر کرد. وارد شوید.');
      } catch (err) { toast(err.message, true); }
    });
  });
}

async function logout(silent = false) {
  if (S.token && !silent) { try { await api('app_logout', { p_token: S.token }); } catch(e){} }
  S.token = null; S.me = null;
  localStorage.clear();
  renderLogin();
}

// =====================================================================
//  قالب اصلی (هدر و منوها)
// =====================================================================
function tabs() {
  return [
    ['dash', 'داشبورد'],
    ['announcements', 'اعلانات'],
    ['requests', S.me?.is_admin ? 'درخواست‌ها' : 'ارتباط با مدیر'],
    ['tx', 'تراکنش‌ها'],
    ['report', 'گزارش ماهانه'],
    ['profile', 'پروفایل']
  ];
}
function adminTabs() {
  return [
    ['units', 'مدیریت واحدها'],
    ['pay', 'تایید پرداخت‌ها'],
    ['rates', 'نرخ‌ها و تنظیمات'],
    ['activity', 'گزارش فعالیت‌ها']
  ];
}

async function renderShell() {
  try { S.me = await T('app_me'); localStorage.setItem('bm_me', JSON.stringify(S.me)); }
  catch(e) { logout(true); return; }

  const is_admin = S.me.is_admin;
  const currentAdminTab = adminTabs().find(t => t[0] === S.view);

  $('#app').innerHTML = `
    <header class="top">
      <div class="top-in">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div class="brand"><span></span>${esc(S.building)}</div>
          
          ${is_admin ? `
            <div class="menu-dropdown">
              <button class="menu-btn" id="admin-menu-btn">
                ⚙️ منوی مدیریت ${currentAdminTab ? `(${currentAdminTab[1]})` : ''} ▼
              </button>
              <div class="menu-content" id="admin-menu">
                ${adminTabs().map(([k,l]) => `<button data-v="${k}" class="${S.view === k ? 'on' : ''}">${l}</button>`).join('')}
              </div>
            </div>
          ` : `
            <nav class="tabs" id="resident-tabs">${tabs().map(([k, l]) => `<button data-v="${k}" class="${S.view === k ? 'on' : ''}">${l}</button>`).join('')}</nav>
          `}
        </div>

        <div class="who">
          <span>واحد ${fa(S.me.unit_no)} · <b>${esc(S.me.full_name || S.me.username)}</b>${is_admin ? ' (مدیر)' : ''}</span>
          <button class="btn-ghost" id="lo">خروج</button>
        </div>
      </div>
    </header>
    <main id="view"></main>`;

  $('#lo').addEventListener('click', () => logout());

  if (is_admin) {
    $('#admin-menu-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      $('#admin-menu').classList.toggle('show');
    });
    document.addEventListener('click', () => $('#admin-menu').classList.remove('show'));
    $$('#admin-menu button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
    
    // منوی افقی ساکنین برای مدیر هم در پایین هدر نمایش داده می‌شود تا دسترسی آسان باشد
    if (!currentAdminTab) {
      $('.top-in').insertAdjacentHTML('beforeend', `<nav class="tabs" id="resident-tabs" style="width:100%;margin-top:8px;border-top:1px solid var(--line);padding-top:12px">${tabs().map(([k, l]) => `<button data-v="${k}" class="${S.view === k ? 'on' : ''}">${l}</button>`).join('')}</nav>`);
    }
  }
  
  $$('#resident-tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
  go(S.view);
}

function go(v) {
  S.view = v;
  const el = $('#view');
  el.innerHTML = `<p class="sub">در حال بارگذاری...</p>`;
  
  const views = { 
    dash: viewDash, announcements: viewAnnouncements, requests: viewRequests, tx: viewTx, 
    pay: viewPay, report: viewReport, units: viewUnits, rates: viewRates, activity: viewActivity, profile: viewProfile 
  };
  renderShellHeaderState();
  (views[v] || viewDash)(el).catch(e => el.innerHTML = `<div class="card" style="color:var(--danger)">خطا: ${esc(e.message)}</div>`);
}

function renderShellHeaderState() {
  const is_admin = S.me.is_admin;
  const currentAdminTab = adminTabs().find(t => t[0] === S.view);
  const menuBtn = $('#admin-menu-btn');
  
  if (menuBtn) {
    menuBtn.innerHTML = `⚙️ منوی مدیریت ${currentAdminTab ? `(${currentAdminTab[1]})` : ''} ▼`;

function billCard(r, rep) {
  const line = (label, amt, ok) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)">
      <span>${label}</span>
      <span style="display:flex;gap:10px;align-items:center">${money(amt)} 
      ${(amt === 0 || ok) ? '<span class="chip ok">پرداخت شده</span>' : '<span class="chip no">پرداخت نشده</span>'}
      </span></div>`;
  return `<div class="card" style="padding:0;overflow:hidden">
    <div style="background:var(--primary);color:#fff;padding:24px;display:flex;justify-content:space-between;align-items:flex-end">
      <div><div style="color:#94a3b8;font-size:13px">صورتحساب ${rep.month_name} ${fa(rep.year)} · واحد ${fa(r.unit_no)}</div>
      <div style="font-size:18px;font-weight:700;margin-top:4px">${esc(r.full_name || '')}</div></div>
      <div style="text-align:left"><small style="color:#94a3b8">مانده قابل پرداخت (تومان)</small><div style="font-size:36px;font-weight:900;line-height:1.2">${fmt(r.remaining)}</div></div>
    </div>
    <div style="padding:10px 24px">
      ${line('شارژ ماهیانه', r.charge, r.ok_charge)}
      ${line('سهم قبض آب', r.water, r.ok_water)}
      ${line('سهم قبض گاز', r.gas, r.ok_gas)}
      ${line('بازسازی', r.repair, r.ok_repair)}
      ${r.parking > 0 ? line('اجاره پارکینگ', r.parking, r.ok_parking) : ''}
    </div>
    <div style="background:#f8fafc;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;border-top:1px solid var(--line)">
      <div><small style="color:var(--muted);display:block">بدهی قبلی</small><b>${money(r.prev_debt)}</b></div>
      <div><small style="color:var(--muted);display:block">هزینه این ماه</small><b>${money(r.current_due)}</b></div>
      <div><small style="color:var(--muted);display:block">پرداختی این ماه</small><b>${money(r.paid_this_month)}</b></div>
    </div></div>`;
}
