<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6366f1">
<title>مجتمع نگین ۲ | مدیریت ساختمان</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M20 80 L20 30 L50 10 L80 30 L80 80 Z' fill='white'/><rect x='40' y='60' width='20' height='20' fill='%236366f1'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--primary:#0f172a;--primary-light:#334155;--accent:#6366f1;--accent-hover:#4f46e5;
--saffron:#f59e0b;--success:#10b981;--warning:#f97316;--danger:#ef4444;
--bg:#f8fafc;--card:#ffffff;--line:#e2e8f0;--ink:#1e293b;--muted:#64748b;
--r:16px;--shadow:0 10px 25px -5px rgba(0,0,0,.05),0 8px 10px -6px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,sans-serif;font-size:14px;line-height:1.7;overflow-x:hidden;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px}
.offline-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px;text-align:center}
.offline-icon{font-size:72px}
header.top{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);box-shadow:0 4px 6px -1px rgba(0,0,0,.02)}
.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;flex-wrap:wrap;gap:16px}
.brand{font-weight:900;font-size:15px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--accent),#818cf8);color:#fff;padding:6px 16px;border-radius:12px;box-shadow:0 4px 12px rgba(99,102,241,.2)}
.brand span{width:8px;height:16px;background:#fff;border-radius:4px;display:inline-block}
.who{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.who b{color:var(--ink)}
.btn-ghost{background:rgba(0,0,0,.04);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-ghost:hover{background:rgba(0,0,0,.08)}
.menu-dropdown{position:relative;display:inline-block}
.menu-btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(15,23,42,.2);font-size:13px}
.menu-btn:hover{background:var(--primary-light)}
.menu-content{display:none;position:absolute;right:0;top:calc(100% + 8px);background:var(--card);min-width:220px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.1);border:1px solid var(--line);z-index:100;overflow:hidden}
.menu-content.show{display:block}
.menu-content button{display:block;width:100%;text-align:right;padding:12px 16px;background:none;border:0;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);font-size:13.5px}
.menu-content button:last-child{border-bottom:0}
.menu-content button:hover{background:var(--bg);color:var(--accent)}
.menu-content button.on{background:rgba(99,102,241,.08);color:var(--accent);font-weight:700;border-right:3px solid var(--accent)}
main{max-width:1200px;margin:auto;padding:28px 24px 80px}
h1{font-size:26px;font-weight:900;margin:0 0 4px;letter-spacing:-.5px}
h2{font-size:18px;font-weight:700;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);transition:transform .2s}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;min-height:46px;width:100%;transition:all .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(99,102,241,.1)}
.btn{border:0;border-radius:12px;padding:10px 20px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.25);transition:all .2s}
.btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 6px 16px rgba(99,102,241,.35)}
.btn.sf{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 12px rgba(245,158,11,.3)}
.btn.sf:hover{background:linear-gradient(135deg,#d97706,#b45309)}
.btn.lt{background:#f1f5f9;color:var(--ink);box-shadow:none}
.btn.lt:hover{background:#e2e8f0}
.btn.rd{background:#fee2e2;color:var(--danger);box-shadow:none}
.btn.rd:hover{background:#fecaca}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 12px;font-size:12.5px;font-weight:700}
.chip.ok{background:#d1fae5;color:#065f46}
.chip.no{background:#fee2e2;color:#991b1b}
.chip.pd{background:#fef3c7;color:#92400e}
.chip.ex{background:#f1f5f9;color:#475569}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:700;color:var(--muted);text-align:right;padding:12px 8px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#f8fafc}
.tbl-wrap{overflow:auto;max-height:70vh;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:12px 24px;border-radius:14px;opacity:0;transition:all .3s;z-index:99;box-shadow:0 10px 25px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
.login{min-height:100vh;display:grid;grid-template-columns:1.2fr 1fr;background:#fff}
.login .art{background:linear-gradient(135deg,var(--primary),#1e293b);display:flex;align-items:center;justify-content:center;padding:40px;color:#fff;position:relative;overflow:hidden}
.login .art h1{font-size:36px;text-align:center;line-height:1.4;font-weight:900}
.login .form{display:flex;align-items:center;justify-content:center;padding:40px}
.login .form .card{width:100%;max-width:400px;border:0;box-shadow:none}
@media(max-width:820px){.login{grid-template-columns:1fr}.login .art{min-height:200px;padding:20px}}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:720px;padding:30px;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto;position:relative}
.modal .x{position:absolute;top:20px;left:20px;background:var(--bg);border:0;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal .x:hover{background:var(--line)}
.accordion-item{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.02)}
.accordion-header{padding:16px 20px;background:#f8fafc;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;transition:background .2s}
.accordion-header:hover{background:#f1f5f9}
.accordion-body{display:none;padding:20px;border-top:1px dashed var(--line);background:var(--card)}
.accordion-body.open{display:block}
.win{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:all .2s}
.win:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   CONSTANTS
   ============================================================ */
const SUPABASE_URL = 'https://hpgvgoehkcpjmdbfmnse.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BuJxTaMP2rYWTe5mh-N55Q_gSHE1O8g';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const CATS = { charge:'شارژ ماهیانه', water:'قبض آب', gas:'قبض گاز', electric:'برق عمومی', repair:'بازسازی', parking:'اجاره پارکینگ', debt:'پرداخت بدهی معوق', other:'سایر', bill:'کل صورتحساب ماه' };
const OCC = ['مالک ساکن','مالک','مستأجر'];

/* ============================================================
   HELPERS
   ============================================================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('fa-IR').format(Math.round(Number(n) || 0));
const fa = v => String(v ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const money = n => `<span style="font-feature-settings:'tnum';white-space:nowrap;color:${Number(n)<0?'var(--danger)':'inherit'}">${fmt(n)}</span>`;

const toNum = v => {
  if (!v) return 0;
  const str = String(v)
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[,\u066C\u066B\s]/g, '')
    .replace(/[^\d.-]/g, '');
  return Number(str) || 0;
};

function jalaliToday() {
  try {
    const p = new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn', { year:'numeric', month:'numeric', day:'numeric' }).formatToParts(new Date());
    const g = t => Number(p.find(x => x.type === t)?.value);
    return { y: g('year'), m: g('month'), d: g('day') };
  } catch {
    const d = new Date();
    return { y: d.getFullYear() - 621, m: d.getMonth() + 1, d: d.getDate() };
  }
}
const TODAY = jalaliToday();

function debounce(fn, ms = 300) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function toast(msg, err = false) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast on' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast', 3200);
}
const showErr = e => toast(e?.message === 'NETWORK_ERROR' ? 'اتصال به سرور برقرار نیست' : (e?.message || 'خطا'), true);

function attachNumericInputIn(root, ...selectors) {
  selectors.forEach(sel => {
    $$(sel, root).forEach(el => {
      el.addEventListener('input', e => {
        const n = toNum(e.target.value);
        e.target.value = n ? fmt(n) : '';
      });
    });
  });
}
const attachNumericInput = (...sels) => attachNumericInputIn(document, ...sels);

/* ============================================================
   STATE
   ============================================================ */
const S = {
  token: localStorage.getItem('bm_token'),
  me: JSON.parse(localStorage.getItem('bm_me') || 'null'),
  view: 'dash', y: TODAY.y, m: TODAY.m,
  building: 'مجتمع نگین ۲',
  txFilter: null,
};

/* ============================================================
   API
   ============================================================ */
function isNetworkError(msg) {
  return !!msg && /failed to fetch|network|fetch|timeout|ECONN|ERR_NETWORK|ERR_INTERNET/i.test(String(msg));
}
async function api(fn, args = {}) {
  try {
    const { data, error } = await sb.rpc(fn, args);
    if (error) {
      const rawMsg = error.message || '';
      if (rawMsg.includes('AUTH_REQUIRED')) { logout(true); throw new Error('AUTH_ERROR'); }
      if (isNetworkError(rawMsg)) throw new Error('NETWORK_ERROR');
      throw new Error(rawMsg.replace(/^AUTH_REQUIRED:\s*/, '') || 'خطا در ارتباط با سرور');
    }
    return data;
  } catch (e) {
    if (isNetworkError(e.message)) throw new Error('NETWORK_ERROR');
    throw e;
  }
}
const T = (fn, args = {}) => api(fn, { p_token: S.token, ...args });

/* ============================================================
   OPTION BUILDERS
   ============================================================ */
const monthOptions = (sel, withAll = false) =>
  (withAll ? `<option value="">همه ماه‌ها</option>` : '') +
  MONTHS.map((n, i) => `<option value="${i+1}" ${+sel === i+1 ? 'selected' : ''}>${n}</option>`).join('');
const yearOptions = (sel) => {
  const ys = []; for (let y = TODAY.y + 1; y >= 1403; y--) ys.push(y);
  return ys.map(y => `<option value="${y}" ${+y === +sel ? 'selected' : ''}>${fa(y)}</option>`).join('');
};
const unitOptions = (sel, withBuilding = true, withAll = false) =>
  (withAll ? `<option value="">همه</option>` : '') +
  (withBuilding ? `<option value="0" ${+sel === 0 ? 'selected' : ''}>ساختمان</option>` : '') +
  Array.from({length:10}, (_,i) => `<option value="${i+1}" ${+sel === i+1 ? 'selected' : ''}>واحد ${fa(i+1)}</option>`).join('');

/* ============================================================
   BIND PERIOD (PATCH 3)
   ============================================================ */
let periodAbort = null;
function bindPeriod(cb) {
  periodAbort?.abort();
  periodAbort = new AbortController();
  const opt = { signal: periodAbort.signal };
  $('#pk-m')?.addEventListener('change', e => { S.m = +e.target.value; cb(); }, opt);
  $('#pk-y')?.addEventListener('change', e => { S.y = +e.target.value; cb(); }, opt);
}
function periodPicker() {
  return `<div class="row no-print" style="display:flex;gap:10px;margin-bottom:20px">
    <select id="pk-m" style="width:120px">${monthOptions(S.m)}</select>
    <select id="pk-y" style="width:100px">${yearOptions(S.y)}</select>
  </div>`;
}

/* ============================================================
   MODAL
   ============================================================ */
function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><button class="x" aria-label="بستن">×</button>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.classList.contains('x')) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

/* ============================================================
   SMS (PATCH 1)
   ============================================================ */
function smsLink(phone, text) {
  if (!phone) return '';
  const safe = String(phone).replace(/[^\d+\-]/g, '').trim();
  if (!safe) return '';
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
  return `sms:${safe}${sep}body=${encodeURIComponent(text)}`;
}
function smsBtn(phone, text, label = 'پیامک') {
  if (!phone) return `<span class="muted" title="شماره ثبت نشده">—</span>`;
  return `<a class="btn lt sm" href="${smsLink(phone, text)}" style="padding:4px 8px;font-size:12px;">✉ ${esc(label)}</a>`;
}

/* ============================================================
   IMAGE COMPRESS
   ============================================================ */
async function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = ev => {
      const img = new Image();
      img.src = ev.target.result;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 800;
        let w = img.width, h = img.height;
        if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
        else { if (h > MAX) { w *= MAX / h; h = MAX; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => resolve(null);
    };
    reader.onerror = () => resolve(null);
  });
}

/* ============================================================
   LOGIN
   ============================================================ */
async function renderLogin() {
  $('#app').innerHTML = `
  <div class="login">
    <div class="art"><h1 id="login-title">${esc(S.building)}</h1></div>
    <div class="form">
      <div class="card">
        <h2>ورود به سامانه</h2>
        <p class="sub">لطفاً اطلاعات خود را وارد کنید.</p>
        <form id="lg" class="grid" style="gap:16px">
          <label class="f">نام کاربری<input id="lg-user" autocomplete="username" dir="ltr" required></label>
          <label class="f">رمز عبور<input id="lg-pass" type="password" autocomplete="current-password" dir="ltr" required></label>
          <button class="btn sf" type="submit" id="lg-btn">ورود به پنل</button>
          <p id="lg-err" style="color:var(--danger);margin:0;min-height:24px"></p>
          <a href="#" id="forgot-pass" style="text-align:center;font-size:13px;color:var(--muted);display:block;">رمز عبور را فراموش کرده‌اید؟</a>
        </form>
      </div>
    </div>
  </div>`;

  try {
    const info = await api('app_public_info');
    if (info?.building_name) {
      S.building = info.building_name;
      const el = $('#login-title'); if (el) el.textContent = S.building;
    }
  } catch (e) {
    if (e.message === 'NETWORK_ERROR') {
      const err = $('#lg-err');
      if (err) err.textContent = 'اتصال به سرور برقرار نیست. اتصال اینترنت را بررسی کنید.';
    }
  }

  $('#lg').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#lg-btn'); const old = btn.textContent;
    btn.disabled = true; btn.textContent = 'در حال بررسی...';
    $('#lg-err').textContent = '';
    try {
      const r = await api('app_login', { p_login: $('#lg-user').value.trim(), p_password: $('#lg-pass').value });
      if (!r.ok) { $('#lg-err').textContent = r.error; return; }
      S.token = r.token; S.me = r.account;
      localStorage.setItem('bm_token', S.token);
      localStorage.setItem('bm_me', JSON.stringify(S.me));
      renderShell();
    } catch (err) { showErr(err); }
    finally { btn.disabled = false; btn.textContent = old; }
  });

  $('#forgot-pass').addEventListener('click', e => {
    e.preventDefault();
    const m = modal(`
      <h2>فراموشی رمز عبور</h2>
      <form id="fp-form" class="grid g2">
        <label class="f">نام کاربری<input id="fp-user" dir="ltr" required></label>
        <label class="f">شماره موبایل<input id="fp-phone" dir="ltr" required></label>
        <label class="f" style="grid-column:1/-1">رمز عبور جدید<input id="fp-pass" type="password" dir="ltr" required></label>
        <button class="btn sf" style="grid-column:1/-1">تغییر رمز عبور</button>
      </form>`);
    $('#fp-form', m).addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const r = await api('app_reset_password', {
          p_username: $('#fp-user', m).value,
          p_phone: $('#fp-phone', m).value,
          p_new_password: $('#fp-pass', m).value,
        });
        if (!r.ok) { toast(r.error, true); return; }
        m.remove(); toast('رمز عبور تغییر کرد. وارد شوید.');
      } catch (err) { showErr(err); }
    });
  });
}

async function logout(silent = false) {
  if (S.token && !silent) { try { await api('app_logout', { p_token: S.token }); } catch {} }
  S.token = null; S.me = null;
  localStorage.clear();
  renderLogin();
}

/* ============================================================
   SHELL
   ============================================================ */
function getMenuItems() {
  const a = S.me?.is_admin;
  return [
    ['dash', 'داشبورد'],
    a && ['units', 'مدیریت واحدها'],
    ['announcements', 'اعلانات'],
    ['requests', a ? 'درخواست‌ها' : 'ارتباط با مدیر'],
    ['tx', 'تراکنش‌ها'],
    a && ['pay', 'تایید پرداخت‌ها'],
    ['report', 'گزارش ماهانه'],
    a && ['rates', 'نرخ‌ها و تنظیمات'],
    a && ['activity', 'گزارش فعالیت‌ها'],
    ['profile', 'پروفایل'],
  ].filter(Boolean);
}

async function renderShell() {
  $('#app').innerHTML = `<div class="loading-screen"><div class="spinner"></div><p class="sub">در حال اتصال به سرور...</p></div>`;
  try {
    S.me = await T('app_me');
    localStorage.setItem('bm_me', JSON.stringify(S.me));
  } catch (e) {
    if (e.message === 'AUTH_ERROR') { logout(true); return; }
    if (e.message === 'NETWORK_ERROR') { showConnectionError(); return; }
    showErr(e); return;
  }

  const menuItems = getMenuItems();
  const current = menuItems.find(t => t[0] === S.view);

  $('#app').innerHTML = `
    <header class="top">
      <div class="top-in">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div class="brand"><span></span>${esc(S.building)}</div>
          <div class="menu-dropdown">
            <button class="menu-btn" id="main-menu-btn">☰ منو ${current ? `(${esc(current[1])})` : ''} ▼</button>
            <div class="menu-content" id="main-menu">
              ${menuItems.map(([k, l]) => `<button data-v="${k}">${esc(l)}</button>`).join('')}
            </div>
          </div>
        </div>
        <div class="who">
          <span>واحد ${fa(S.me.unit_no || '—')} · <b>${esc(S.me.full_name || S.me.username)}</b>${S.me.is_admin ? ' (مدیر)' : ''}</span>
          <button class="btn-ghost" id="lo">خروج</button>
        </div>
      </div>
    </header>
    <main id="view"></main>`;

  $('#lo').addEventListener('click', () => logout());
  $('#main-menu-btn').addEventListener('click', e => { e.stopPropagation(); $('#main-menu').classList.toggle('show'); });
  document.addEventListener('click', () => $('#main-menu')?.classList.remove('show'));
  $$('#main-menu button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
  go(S.view);
}

function go(v) {
  S.view = v;
  const el = $('#view'); if (!el) return;
  el.innerHTML = `<p class="sub">در حال بارگذاری...</p>`;
  const views = {
    dash: viewDash, announcements: viewAnnouncements, requests: viewRequests,
    tx: viewTx, pay: viewPay, report: viewReport, units: viewUnits,
    rates: viewRates, activity: viewActivity, profile: viewProfile,
  };
  renderShellHeaderState();
  (views[v] || viewDash)(el).catch(e => {
    if (e.message === 'AUTH_ERROR') { logout(true); return; }
    if (e.message === 'NETWORK_ERROR') {
      el.innerHTML = `<div class="card" style="text-align:center;padding:60px 20px">
        <div style="font-size:48px;margin-bottom:16px">📡</div>
        <h2>اتصال به سرور برقرار نیست</h2>
        <p class="sub">لطفاً اینترنت خود را بررسی کنید</p>
        <button class="btn sf" data-retry>تلاش مجدد</button>
      </div>`;
      $('[data-retry]', el)?.addEventListener('click', () => go(v));
      return;
    }
    showErr(e);
    el.innerHTML = `<div class="card" style="color:var(--danger)">خطا: ${esc(e.message)}</div>`;
  });
}

function renderShellHeaderState() {
  const menuItems = getMenuItems();
  const current = menuItems.find(t => t[0] === S.view);
  const btn = $('#main-menu-btn');
  if (btn) btn.innerHTML = `☰ منو ${current ? `(${esc(current[1])})` : ''} ▼`;
  $$('#main-menu button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
}

function showConnectionError() {
  $('#app').innerHTML = `
    <div class="offline-screen">
      <div class="offline-icon">📡</div>
      <h1>اتصال به سرور برقرار نیست</h1>
      <p class="sub" style="max-width:420px">لطفاً اتصال اینترنت خود را بررسی کنید و دوباره تلاش کنید. اطلاعات حساب شما حفظ شده است.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn sf" id="retry" style="min-width:180px">تلاش مجدد</button>
        <button class="btn lt" id="lo2" style="min-width:180px">خروج از حساب</button>
      </div>
    </div>`;
  $('#retry').addEventListener('click', renderShell);
  $('#lo2').addEventListener('click', () => logout());
}
