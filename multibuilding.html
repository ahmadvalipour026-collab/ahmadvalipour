  </div>
  <div class="sec-title">ریز اقلام صورتحساب</div>
  ${charges.length ? `<div class="tbl-wrap" style="margin-bottom:20px"><table><thead><tr><th>شرح</th><th>مبلغ اصلی</th><th>پرداخت‌شده</th><th>مانده ردیف</th><th>تاریخ</th><th>نوع</th></tr></thead><tbody>
  ${charges.map(c => `<tr><td>${esc(c.description)}</td><td>${fmt(c.amount)}</td><td>${fmt(c.paid_amount||0)}</td><td>${fmt(c.outstanding_amount??c.amount)}</td><td>${esc(c.item_date)}</td><td>${c.item_type === 'expense' ? '<span class="chip ex">هزینه</span>' : '<span class="chip pd">بدهی اولیه</span>'}</td></tr>`).join('')}
  </tbody></table></div>` : `<div class="empty"><p>صورتحسابی ثبت نشده</p></div>`}
  <div class="card" style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;gap:12px"><b>بستانکاری منتقل‌شده</b><b style="color:var(--success)">− ${fmt(s.credit_balance||0)} تومان</b></div><div style="display:flex;justify-content:space-between;gap:12px;margin-top:8px"><b>مانده نهایی حساب</b><b>${fmt(s.account_balance||0)} تومان</b></div></div>
  <div class="sec-title">سابقه پرداخت‌ها</div>
  ${payments.length ? `<div class="tbl-wrap"><table><thead><tr><th>مبلغ</th><th>شرح</th><th>وضعیت</th><th>تاریخ</th></tr></thead><tbody>${payments.map(p => `<tr><td>${fmt(p.amount)}</td><td>${esc(p.description||'—')}</td><td>${p.status === 'approved' ? '<span class="chip ok">تایید</span>' : p.status === 'pending' ? '<span class="chip pd">در انتظار</span>' : p.status === 'rejected' ? '<span class="chip no">رد</span>' : '<span class="chip ex">' + esc(p.status) + '</span>'}</td><td>${esc(p.payment_date)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty"><p>پرداختی ثبت نشده</p></div>`}`;
}

async function viewManagerMyPay(el) {
  if (!isManager()) { el.innerHTML = '<div class="empty">فقط مدیر به این صفحه دسترسی دارد</div>'; return; }
  await viewResidentPay(el);
  const heading = el.querySelector('h1'); if (heading) heading.textContent = 'پرداخت بدهی شخصی مدیر';
}

async function viewResidentPay(el) {
  const m = currentMembership(); if (!m) return;
  const s = await T('app_resident_get_financial_summary', { p_building_id: m.building_id, p_membership_id: m.membership_id });
  const charges = (s.charges || []).filter(c => Number(c.outstanding_amount ?? c.amount) > 0);
  const totalOutstanding = charges.reduce((sum,c) => sum + Number(c.outstanding_amount ?? c.amount ?? 0),0);
  const credit = Number(s.credit_balance || 0);
  const netPayable = Math.max(0,Math.round(totalOutstanding-credit));
  const dateOrder = [...charges].sort((a,b) => String(a.item_date).localeCompare(String(b.item_date)));
  el.innerHTML = `<h1>پرداخت</h1><p class="sub">${esc(m.building_name)} · واحد ${fa(s.unit_no)}</p>
    ${charges.length ? `<form id="pay-form" class="card">
      <h2>ریز محاسبه مبلغ پرداخت</h2>
      <p class="sub">مبلغ اصلی هر شارژ و پرداخت‌های قبلی جداگانه نمایش داده می‌شود. بستانکاری فقط در جمع نهایی کسر می‌شود و مبلغ هیچ ردیفی را صفر نمی‌کند.</p>
      <div class="tbl-wrap" style="margin:16px 0"><table><thead><tr><th>شرح</th><th>مبلغ اصلی</th><th>پرداخت قبلی</th><th>مانده ردیف</th></tr></thead><tbody>
      ${charges.map(c => `<tr><td>${esc(c.description)}</td><td>${fmt(c.amount)}</td><td>${fmt(c.paid_amount||0)}</td><td>${fmt(c.outstanding_amount??c.amount)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="card" style="background:var(--bg);margin-bottom:14px;padding:14px 18px">
        <div style="display:flex;justify-content:space-between;gap:12px"><span>جمع مانده ریز اقلام</span><b>${fmt(totalOutstanding)} تومان</b></div>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:var(--success)"><span>کسر بستانکاری قبلی</span><b>− ${fmt(credit)} تومان</b></div>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-top:12px;border-top:1px solid var(--border);padding-top:12px;font-size:18px"><b>مبلغ نهایی قابل پرداخت</b><b id="pay-total" style="color:var(--navy)">${fmt(netPayable)} تومان</b></div>
      </div>
      <div class="grid g2" style="gap:14px"><label class="f">تاریخ پرداخت<input id="pay-date" class="date-picker-input" readonly placeholder="انتخاب تاریخ" required></label><label class="f">توضیحات (اختیاری)<input id="pay-note" placeholder="مثلاً: فیش بانکی"></label></div>
      <button class="btn" type="submit" style="margin-top:14px;width:100%" ${netPayable<=0?'disabled':''}>ثبت پرداخت نهایی</button>
    </form>` : `<div class="card"><div class="sec-title">مانده حساب</div><h2>${fmt(s.account_balance||0)} تومان</h2><p class="sub">${credit>0?'حساب شما بستانکار است و این مبلغ به دوره‌های بعد منتقل می‌شود.':'بدهی قابل پرداختی ثبت نشده است.'}</p></div>`}`;
  if (!charges.length || netPayable<=0) return;
  bindDatePickers(el);
  $('#pay-form', el).addEventListener('submit', async e => {
    e.preventDefault();
    let remaining=netPayable;
    const allocations=[];
    for (const c of dateOrder) {
      if (remaining<=0) break;
      const available=Number(c.outstanding_amount ?? c.amount ?? 0);
      const amount=Math.min(available,remaining);
      if (amount>0) { allocations.push({type:'expense',id:c.id,amount}); remaining-=amount; }
    }
    const total=allocations.reduce((sum,a)=>sum+a.amount,0);
    if (!allocations.length || Math.round(total)!==Math.round(netPayable)) { toastErr('محاسبه ریز پرداخت با مانده حساب سازگار نیست'); return; }
    try {
      await T('app_submit_itemized_payment', {
        p_building_id:m.building_id,p_membership_id:m.membership_id,
        p_payment_date:$('#pay-date',el).dataset.gregorian || $('#pay-date',el).value,
        p_description:$('#pay-note',el).value || null,p_allocations:allocations,p_total_amount:total
      });
      toastOk('پرداخت ثبت شد'); go('r_dash');
    } catch(err) { showErr(err); }
  });
}

async function viewResidentRequests(el) {
  const m = currentMembership(); if (!m) return;
  const list = await T('app_resident_list_building_requests', { p_building_id: m.building_id, p_membership_id: m.membership_id });
  const statusChip = s => { if (s === 'resolved') return '<span class="chip ok">انجام شد</span>'; if (s === 'answered') return '<span class="chip ok">پاسخ داده شد</span>'; if (s === 'in_progress') return '<span class="chip pd">در حال بررسی</span>'; if (s === 'rejected') return '<span class="chip no">رد شد</span>'; return '<span class="chip ex">جدید</span>'; };
  el.innerHTML = `<h1>درخواست‌ها</h1><p class="sub">ثبت و پیگیری درخواست‌ها</p><form id="rf" class="card" style="margin-bottom:20px"><h2>ثبت درخواست جدید</h2><div class="grid" style="gap:14px"><label class="f">نوع درخواست<select id="rf-type"><option value="repair">درخواست تعمیر</option><option value="suggestion">انتقاد و پیشنهاد</option><option value="complaint">شکایت</option><option value="other">سایر</option></select></label><label class="f">عنوان<input id="rf-title" required minlength="3" maxlength="150"></label><label class="f">توضیحات<textarea id="rf-desc" rows="3" required minlength="3" maxlength="5000"></textarea></label><button class="btn" type="submit">ارسال به مدیر</button></div></form><div class="sec-title">سابقه درخواست‌ها</div>${list.length ? list.map(r => `<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap"><b>${esc(r.title)}</b>${statusChip(r.request_status)}</div><div class="sub" style="margin:0 0 8px">${REQ_TYPES[r.request_type] || r.request_type}</div><p style="margin:0 0 10px;white-space:pre-wrap">${esc(r.description)}</p>${r.manager_reply ? `<div style="background:var(--bg);border-right:3px solid var(--peach);padding:10px 14px;border-radius:10px"><div class="sub" style="margin:0 0 4px">پاسخ مدیر:</div><div style="white-space:pre-wrap">${esc(r.manager_reply)}</div></div>` : ''}</div>`).join('') : `<div class="empty"><div class="ico">📭</div><p>درخواستی ثبت نکرده‌اید</p></div>`}`;
  $('#rf', el).addEventListener('submit', async e => { e.preventDefault(); try { await T('app_submit_building_request', { p_building_id: m.building_id, p_membership_id: m.membership_id, p_request_type: $('#rf-type', el).value, p_title: $('#rf-title', el).value, p_description: $('#rf-desc', el).value }); toastOk('ارسال شد'); go('r_requests'); } catch (err) { showErr(err); } });
}

function viewServices(el) {
  const isAdmin = S.me.is_superadmin, mgr = isManager();
  let items = [];
  if (isAdmin) { items = [['sa_buildings', 'ساختمان‌ها', '🏢'], ['sa_requests', 'درخواست مدیران', '👥'], ['sa_profile', 'پروفایل', '👤']]; }
  else if (mgr) { items = [['m_units', 'واحدها و ساکنین', '👥'], ['m_expenses', 'تراکنش‌ها', '💸'], ['m_payments', 'تایید پرداخت', '✅'], ['m_my_pay', 'پرداخت بدهی خودم', '💳'], ['m_requests_pending', 'تایید ثبت‌نام', '📝'], ['m_transfer', 'انتقال مدیریت', '🔄'], ['m_rates', 'تنظیمات مالی', '⚙️'], ['m_report', 'گزارش ماهانه', '📊'], ['m_requests', 'درخواست‌ها', '💬'], ['profile', 'پروفایل', '👤']]; }
  else { items = [['r_charges', 'صورتحساب', '📄'], ['r_pay', 'پرداخت', '💸'], ['r_requests', 'درخواست‌ها', '💬'], ['profile', 'پروفایل', '👤']]; }
  el.innerHTML = `<h1>خدمات</h1><p class="sub">دسترسی سریع به بخش‌های سامانه</p><div class="grid g3">${items.map(([k, l, ic]) => `<button class="card" data-go="${k}" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:20px;gap:10px;border:0;text-align:center"><div style="font-size:32px">${ic}</div><b>${l}</b></button>`).join('')}</div>`;
  $$('[data-go]', el).forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

async function viewProfile(el) {
  const m = currentMembership();
  el.innerHTML = `<h1>پروفایل</h1><p class="sub">اطلاعات حساب شما</p><div class="card" style="margin-bottom:20px"><h2>اطلاعات حساب</h2><div class="grid g2" style="margin-top:12px"><div><small class="sub">نام کاربری</small><div style="font-weight:800;direction:ltr;text-align:right">${esc(S.me.username)}</div></div><div><small class="sub">نقش</small><div style="font-weight:800">${S.me.is_superadmin ? 'ادمین اصلی' : (m?.access_role === 'manager' ? 'مدیر ساختمان' : (m?.resident_type ? (m.resident_type === 'owner_resident' ? 'مالک ساکن' : m.resident_type === 'tenant' ? 'مستاجر' : 'مالک') : '—'))}</div></div>${m ? `<div><small class="sub">ساختمان</small><div style="font-weight:800">${esc(m.building_name)}</div></div>` : ''}</div></div><form id="pf-pass" class="card grid" style="gap:14px;max-width:640px;margin-top:20px"><h2>تغییر رمز عبور</h2><p class="sub">${PWD_HINT}</p><label class="f">رمز جدید<input id="p-new" type="password" dir="ltr" maxlength="6" autocomplete="new-password"></label><label class="f">تکرار رمز<input id="p-new2" type="password" dir="ltr" maxlength="6"></label><button class="btn lt" type="submit">تغییر رمز</button></form><div class="card" style="margin-top:20px"><h2>تم رنگی</h2>${themeSwatchesHTML()}</div>`;
  bindThemeSwatches(el);
  $('#pf-pass').addEventListener('submit', async e => {
    e.preventDefault(); const np = $('#p-new').value, np2 = $('#p-new2').value;
    if (!isStrongPwd(np)) { toastErr(PWD_HINT); return; }
    if (np !== np2) { toastErr('تکرار رمز یکسان نیست'); return; }
    try { await T('app_change_password', { p_new_password: np }); S.me.must_change_password = false; persistSession(); toastOk('رمز تغییر کرد'); } catch (err) { showErr(err); }
  });
}

  if (!S.me) return;

    history.pushState({ app: true }, '', '');
  }
});
history.replaceState({ app: true }, '', '');
history.pushState({ app: true }, '', '');
